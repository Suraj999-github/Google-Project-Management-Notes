<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PM Certificate Mock Test 2</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--leaf:#2f6b2f;--lime:#8fc31f;--sun:#f5c518;--cream:#fffbe6;--ink:#1d2b12;--mist:#f3f8e4}
body{background:var(--cream);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.6}
h1,h2,h5,.btn,.badge{font-family:"Trebuchet MS",Verdana,sans-serif}
.top{background:linear-gradient(120deg,var(--sun),var(--lime));border-bottom:6px solid var(--leaf);padding:1.5rem 0}
.bar{position:sticky;top:0;z-index:20;background:var(--leaf);color:#fff;padding:.5rem 0}
.bar .progress{height:.7rem;background:#cfe3a8}.bar .progress-bar{background:var(--sun)}
.qcard{background:#fff;border:2px solid var(--lime);border-left-width:8px;border-radius:.6rem;padding:1rem 1.1rem;margin-bottom:1rem}
.qcard.ok{border-color:var(--leaf);background:#f1fae6}
.qcard.bad{border-color:#c0392b;background:#fdf0ee}
.opt{display:block;border:1px solid #cfdcaa;border-radius:.4rem;padding:.45rem .7rem;margin-bottom:.4rem;cursor:pointer}
.opt:hover{background:var(--mist)}
.opt.right{background:#d8f0b8;border-color:var(--leaf);font-weight:bold}
.opt.wrong{background:#f8d7d3;border-color:#c0392b}
.opt input{margin-right:.5rem}
.reason{background:var(--mist);border-left:5px solid var(--sun);padding:.6rem .8rem;border-radius:.3rem;margin-top:.7rem}
.btn-leaf{background:var(--leaf);color:#fff}.btn-leaf:hover{background:#245524;color:#fff}
.btn-sun{background:var(--sun);color:var(--ink)}.btn-sun:hover{background:#dfb10d}
.btn:focus,.form-check-input:focus,.form-select:focus{box-shadow:0 0 0 .25rem rgba(47,107,47,.45)}
.form-select{max-width:260px;display:inline-block}
.matchrow{margin-bottom:.5rem}
</style>
</head>
<body>
<header class="top"><div class="container">
  <h1 class="h2 fw-bold mb-1">Mock Test 2: Google PM Certificate</h1>
  <p class="mb-0">Original practice simulation, not an official Google assessment. 50 questions. Choose your answer, press Check answer to score it, and press View answer to see the correct choice and the reason.</p>
</div></header>

<div class="bar"><div class="container">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
    <div><strong id="sc">Score 0 / 50</strong> &nbsp; Checked <span id="at">0</span> / 50 &nbsp; Time <span id="tm">00:00</span></div>
    <div class="d-flex gap-2">
      <button class="btn btn-sm btn-sun" onclick="finish()">Finish and see result</button>
      <button class="btn btn-sm btn-light" onclick="resetAll()">Reset</button>
    </div>
  </div>
  <div class="progress mt-2" role="progressbar" aria-label="Checked questions"><div class="progress-bar" id="pb" style="width:0%"></div></div>
</div></div>

<main class="container py-4">
  <div id="result" class="qcard d-none"></div>
  <div id="qs"></div>
</main>

<script>
const SEC={A:"Initiation and scoping",B:"Planning and schedule",C:"Budget and earned value",D:"Risk",E:"Stakeholders and communication",F:"Teams and leadership",G:"Quality",H:"Change management",I:"Agile and Kanban",J:"Closure and career"};
const TF=["True","False"];
// [section, question, options, answer indices, reason, kind(optional: x = matching), match items]
const Q=[
["A","Which statement describes a project?",["Ongoing work with no end date","Temporary work with a defined start and end that produces a unique result","A process repeated every day","Any work done using Agile"],[1],"A project is temporary and creates something unique. Repeating, ongoing work is operations."],
["A","“The launch must happen before December 1.” In a project plan, this is best classified as:",["An assumption","A constraint","A risk","A dependency"],[1],"A fixed limit such as a deadline is a constraint. An assumption is unconfirmed, and a risk is an uncertain event."],
["A","Which two items normally belong in a project charter? (Select 2)",["Purpose and high-level goals","Each person’s daily task assignments","Sponsor approval (signature)","The detailed sprint backlog"],[0,2],"The charter records purpose, goals, scope, and the sponsor’s authorization. Daily tasks and sprint backlogs come later."],
["A","Which is a measurable acceptance criterion?",["“The app should be intuitive.”","“A user completes checkout in under 90 seconds in testing with 5 users.”","“Customers will love it.”","“The design should feel premium.”"],[1],"It has a number and a test with a clear pass or fail. The others are opinions."],
["A","Two stakeholders give conflicting requirements for a report. What is the best action?",["Build whichever was requested first","Facilitate a discussion about the needs behind each request, ask the sponsor to decide where they still conflict, and document it","Build both without telling anyone","Ignore both and choose yourself"],[1],"Understand interests first, then let the person with authority decide and record the decision."],
["A","“A stakeholder register should be updated only once, at project start.”",TF,[1],"False. Interest, influence, and attitude change, so review the register regularly."],
["B","Task A (3 days) starts first. B (2 days) and C (5 days) follow A. D (4 days) follows B. E (1 day) follows both C and D. What is the project duration, and what is the slack on C?",["10 days; slack 1","9 days; slack 0","10 days; slack 5","15 days; slack 1"],[0],"A-B-D-E = 3+2+4+1 = 10 (critical). A-C-E = 3+5+1 = 9, so C’s slack = 10 − 9 = 1."],
["B","A task has O = 2, M = 5, P = 14 days. What are the PERT estimate and standard deviation?",["5 days; SD 2","6 days; SD 2","7 days; SD 2","6 days; SD 12"],[1],"PERT = (2 + 4×5 + 14) ÷ 6 = 36 ÷ 6 = 6. SD = (14 − 2) ÷ 6 = 2. The simple average would be 7."],
["B","The team overlaps two tasks that were planned in sequence to finish sooner. This is called:",["Crashing","Fast-tracking","Resource leveling","Rebaselining"],[1],"Overlapping sequential tasks is fast-tracking, which adds the risk of rework. Crashing adds resources and cost."],
["B","A task has an earliest start of day 4 and a latest start of day 7. What is its slack?",["0 days","1 day","3 days","7 days"],[2],"Slack = LS − ES = 7 − 4 = 3 days."],
["B","Which two statements about a WBS are true? (Select 2)",["It breaks scope into deliverable-focused components","It shows the start and end dates of each task","Its lowest level is the work package","It ranks risks by probability"],[0,2],"The WBS breaks scope down to work packages. Dates belong to the schedule and risk ranking belongs to the risk register."],
["B","Estimating a new project’s duration from a similar past project is:",["Bottom-up estimating","Analogous estimating","Parametric estimating","Three-point estimating"],[1],"Analogous estimating uses a comparable earlier project. It is quick but rough."],
["C","BAC = $120,000, PV = $60,000, EV = $54,000, AC = $63,000. What are CV and SV?",["CV −$9,000; SV −$6,000","CV −$6,000; SV −$9,000","CV +$9,000; SV +$6,000","CV −$9,000; SV +$6,000"],[0],"CV = EV − AC = 54,000 − 63,000 = −9,000. SV = EV − PV = 54,000 − 60,000 = −6,000."],
["C","Using the same figures (PV $60,000, EV $54,000, AC $63,000), what are CPI and SPI?",["CPI 0.86; SPI 0.90","CPI 0.90; SPI 0.86","CPI 1.17; SPI 1.11","CPI 0.86; SPI 1.11"],[0],"CPI = 54 ÷ 63 = 0.86. SPI = 54 ÷ 60 = 0.90. Both are below 1, so the project is over budget and behind plan."],
["C","Using BAC = $120,000, AC = $63,000, and CPI = 0.857, and assuming current cost performance continues, what are EAC and ETC?",["EAC $140,000; ETC $77,000","EAC $129,000; ETC $66,000","EAC $140,000; ETC $140,000","EAC $120,000; ETC $57,000"],[0],"EAC = BAC ÷ CPI = 120,000 ÷ 0.857 = 140,000. ETC = 140,000 − 63,000 = 77,000. The $129,000 option uses the one-off formula."],
["C","BAC = $50,000, EV = $18,000, AC = $21,000. The overrun was a one-off, and the rest will run to plan. What are EAC and VAC (VAC = BAC − EAC)?",["EAC $53,000; VAC −$3,000","EAC $58,333; VAC −$8,333","EAC $50,000; VAC $0","EAC $53,000; VAC +$3,000"],[0],"One-off: EAC = AC + (BAC − EV) = 21,000 + 32,000 = 53,000. VAC = 50,000 − 53,000 = −3,000."],
["C","BAC = $200,000, the project is 40% complete, and AC = $75,000. What are EV and CPI?",["EV $80,000; CPI 1.07","EV $75,000; CPI 1.00","EV $80,000; CPI 0.94","EV $40,000; CPI 0.53"],[0],"EV = 40% × 200,000 = 80,000. CPI = 80,000 ÷ 75,000 = 1.07, so the project is under budget."],
["C","“An SPI below 1.0 means the project is progressing slower than planned.”",TF,[0],"True. SPI = EV ÷ PV, so below 1.0 means less work done than planned. Check the critical path to see whether the end date is at risk."],
["D","Risk A: 40% chance of −$5,000. Risk B: 10% chance of −$30,000. Opportunity C: 50% chance of +$2,000. What is the net EMV?",["−$6,000","−$4,000","−$3,000","+$1,000"],[1],"A = −2,000, B = −3,000, C = +1,000. Net = −$4,000."],
["D","Which two are risks, not issues? (Select 2)",["“The supplier may deliver late.”","“The server crashed and testing is blocked.”","“A key developer might resign.”","“An approval is overdue and work has stopped.”"],[0,2],"Risks are uncertain future events. B and D are already happening, so they are issues."],
["D","Switching to a proven vendor so that an unproven technology is never used is which response?",["Avoid","Mitigate","Transfer","Accept"],[0],"Avoid removes the cause of the risk. Mitigate reduces probability or impact, and transfer shifts the consequence."],
["D","You add a contractor to reduce a schedule risk, but the contractor’s lack of knowledge creates a new risk. This is a:",["Residual risk","Secondary risk","Trigger","Issue"],[1],"A secondary risk is created by the response itself. Residual risk is what remains of the original risk."],
["E","A regulator has high power over your project but little interest in the details. The best approach is to:",["Monitor","Keep informed","Keep satisfied","Manage closely"],[2],"High power and low interest means meet their needs without overloading them."],
["E","In a RACI matrix, a person who gives two-way input before a decision is:",["Responsible","Accountable","Consulted","Informed"],[2],"Consulted means two-way input. Informed is one-way updates."],
["E","Team progress is posted on a shared wiki that stakeholders open when they choose. This is:",["Push communication","Pull communication","Interactive communication","Escalation"],[1],"Pull means the audience retrieves the information when needed."],
["E","Channels = n(n − 1) ÷ 2. A team grows from 5 to 9 people. How many channels exist at 9, and how many were added?",["36 channels; 26 added","36 channels; 4 added","72 channels; 62 added","45 channels; 35 added"],[0],"5 people: 10 channels. 9 people: 9 × 8 ÷ 2 = 36. Added = 26."],
["E","The sponsor learned of a delay from a team member before you told her. What is the best response?",["Explain it was too minor to report","Acknowledge the gap, share the facts and recovery options, and agree how and when she wants updates","Send daily emails from now on","Tell the team not to speak to her"],[1],"Repair trust, give her the facts and options, and fix the communication process."],
["F","Frequent disagreements about methods and roles in the second week usually indicate which Tuckman stage?",["Forming","Storming","Norming","Adjourning"],[1],"Storming is the conflict stage and is normal. Facilitate rather than suppress it."],
["F","Which statement best follows the Situation-Behavior-Impact structure?",["“You are careless.”","“In Monday’s demo, the report arrived after the meeting began, so the sponsor saw unverified results. What got in the way?”","“Everyone thinks you are unreliable.”","“Please do better.”"],[1],"It names the situation, a specific behavior, and the impact, then asks for their view."],
["F","Which describes good delegation?",["Dictate every step and check hourly","Explain the outcome and why it matters, set criteria and checkpoints, give authority and resources, then follow up","Assign it and disappear until the deadline","Do it yourself"],[1],"Delegate outcomes with clear criteria and checkpoints. You remain accountable."],
["F","A production outage needs an immediate decision with no time for discussion. Which conflict approach fits best?",["Collaborate","Compromise","Compete (force)","Accommodate"],[2],"Forcing a quick decision suits emergencies. Collaboration suits important issues when time is available."],
["G","Which two are quality assurance (process) activities? (Select 2)",["A process audit","Running test cases on the checkout flow","Training the team on coding standards","Inspecting the final deliverable"],[0,2],"QA works on the process to prevent defects. Testing and inspecting are QC, which examines the product."],
["G","Defects by category: 35, 30, 20, 10, and 5 (100 total). How many of the largest categories are needed to account for at least 80% of defects?",["2","3","4","5"],[1],"Cumulative: 35%, 65%, 85%. Three categories pass 80%."],
["G","80 test cases were run and 72 passed. The target pass rate is 95%. What is the current rate, and how many more must pass?",["90%; 4 more","90%; 8 more","95%; 0 more","85%; 4 more"],[0],"72 ÷ 80 = 90%. 95% × 80 = 76, so 4 more must pass."],
["G","Match each cost to its cost-of-quality category.",["Appraisal","Internal failure","Prevention"],[2,0,1],"Training prevents defects. System tests find defects (appraisal). Rework before delivery is internal failure.","x",["Training developers on code standards","Running system tests","Reworking defects found before delivery"]],
["H","After receiving a change request, the first step is to:",["Approve it","Log it and assess the impact on scope, schedule, cost, quality, and risk","Reject it","Implement it informally"],[1],"Decisions need impact information, so log and assess before deciding."],
["H","A change adds 5 days to a critical-path task and $3,000. The schedule has a 3-day buffer, and the budget is $40,000. If approved, what are the net delay and the revised budget?",["2 days; $43,000","5 days; $43,000","2 days; $37,000","8 days; $43,000"],[0],"Net delay = 5 − 3 = 2 days. Revised budget = 40,000 + 3,000 = $43,000."],
["H","Staff used the new tool for a month, then drifted back to the old spreadsheet because nobody followed up. Which ADKAR element is weakest?",["Awareness","Knowledge","Ability","Reinforcement"],[3],"Reinforcement keeps the new behavior in place through check-ins, recognition, and removing the old option."],
["I","Which of these is a Scrum event?",["Product Backlog","Increment","Sprint Review","Sprint Backlog"],[2],"The events are the Sprint, Sprint Planning, Daily Scrum, Sprint Review, and Sprint Retrospective. The others are artifacts."],
["I","Which two are required by the Scrum Guide? (Select 2)",["A Sprint Goal","Story points","A Definition of Done","Burndown charts"],[0,2],"The Sprint Goal and Definition of Done are Scrum commitments. Story points and burndown charts are common practice, not requirements."],
["I","A team completed 16, 20, and 18 points in three sprints. 90 points remain. Using the average velocity, how many sprints are needed?",["4","5","6","7"],[1],"Average = 54 ÷ 3 = 18. 90 ÷ 18 = 5 sprints."],
["I","A team committed to items of 8, 5, 3, 3, and 2 points. It finished the 8, the 5, and one 3. The second 3-point item is 80% done and the 2-point item was not started. What is the velocity?",["16","18","19","21"],[0],"Only items that meet the Definition of Done count: 8 + 5 + 3 = 16. Partly done work counts as zero."],
["I","A 10-day sprint starts with 30 points. After day 5, 20 points remain. How does this compare with the ideal burndown?",["5 points behind","5 points ahead","10 points behind","Exactly on track"],[0],"Ideal = 3 points per day, so 15 remain after day 5. Actual is 20, so 5 points behind."],
["I","Mid-sprint, a manager asks a developer to add an urgent task. What should happen?",["The developer does it quietly","The request goes to the Product Owner, who adds it to the backlog. If it truly cannot wait, the PO and Developers renegotiate scope without changing the Sprint Goal","The Scrum Master cancels the sprint","The project manager assigns it to someone else"],[1],"The PO orders the backlog, and the Developers own the sprint plan. Only the PO can cancel a sprint."],
["I","In Kanban, a request arrives on day 0, work starts on day 3, and it is delivered on day 8. What are its lead time and cycle time?",["Lead time 8 days; cycle time 5 days","Lead time 5 days; cycle time 8 days","Lead time 3 days; cycle time 8 days","Both 8 days"],[0],"Lead time runs from request to delivery (8). Cycle time runs from work start to delivery (8 − 3 = 5)."],
["J","The sponsor says in a hallway, “Looks good to me.” What should you do?",["Close the project","Verify the deliverables against the acceptance criteria and obtain written, signed acceptance with any known exceptions","Wait three months","Ask the team to approve it"],[1],"Verbal approval is easily forgotten. Signed acceptance against agreed criteria ends disputes."],
["J","Original baseline: $60,000. Approved changes: +$5,000 and −$2,000. Actual cost: $62,500. How should the result be reported?",["$2,500 over the original baseline and $500 under the revised budget","$500 over the original baseline and $2,500 under the revised budget","$2,500 under budget in every comparison","On budget in every comparison"],[0],"Revised budget = 60,000 + 5,000 − 2,000 = 63,000. Actual 62,500 is $500 under revised and $2,500 over the original."],
["J","A handover to operations is complete when:",["The documents have been emailed","The receiving team confirms it can operate the product, for example by practicing a restore","The project manager says so","The team is released"],[1],"A handover is complete when the receiver can operate what they received, not when documents are sent."],
["J","Which is the best way to list the Google certificate on a resume?",["“PMP-certified Project Manager”","“Google Project Management Professional Certificate (Coursera), completed [month, year]”","“Google-certified guaranteed project manager”","Leave it off"],[1],"State exactly what you hold. The certificate is not a PMP and does not guarantee a job."],
["J","In a STAR answer, which part describes what you personally did?",["Situation","Task","Action","Result"],[2],"Action covers your own steps. Spend most of your time on Action and Result, and say “I.”"]
];
const st=[];let t0=Date.now(),timer;
const L="ABCDEFGH";
const esc=s=>s;
function build(){
  document.getElementById("qs").innerHTML=Q.map((q,i)=>{
    const [s,txt,o,a,r,k,items]=q,multi=a.length>1&&k!=="x";
    let body="";
    if(k==="x"){
      body=items.map((it,j)=>`<div class="matchrow"><div>${j+1}. ${it}</div><select class="form-select form-select-sm" id="q${i}m${j}" aria-label="Answer for item ${j+1}"><option value="">Choose...</option>${o.map((x,n)=>`<option value="${n}">${L[n]}. ${x}</option>`).join("")}</select></div>`).join("");
    }else{
      body=o.map((x,n)=>`<label class="opt" id="q${i}o${n}"><input type="${multi?"checkbox":"radio"}" name="q${i}" value="${n}">${L[n]}. ${x}</label>`).join("");
    }
    const hint=k==="x"?"Match each item":multi?"Select "+a.length:"Select 1";
    return `<div class="qcard" id="c${i}"><div class="d-flex justify-content-between mb-2"><h5 class="mb-0">Question ${i+1}</h5><span><span class="badge text-bg-success">${SEC[s]}</span> <span class="badge text-bg-warning">${hint}</span></span></div><p>${txt}</p>${body}<div class="d-flex flex-wrap gap-2 align-items-center mt-2"><button class="btn btn-sm btn-leaf" onclick="check(${i})">Check answer</button><button class="btn btn-sm btn-sun" onclick="view(${i})">View answer</button><span id="f${i}" class="fw-bold" role="status"></span></div><div id="r${i}" class="reason d-none"></div></div>`;
  }).join("");
  Q.forEach((_,i)=>st[i]={chk:false,ok:null});
}
function read(i){
  const q=Q[i];
  if(q[5]==="x"){
    const v=q[6].map((_,j)=>document.getElementById(`q${i}m${j}`).value);
    return v.includes("")?null:v.map(Number);
  }
  const v=[...document.querySelectorAll(`input[name=q${i}]:checked`)].map(e=>+e.value);
  return v.length?v:null;
}
function check(i){
  const q=Q[i],u=read(i),f=document.getElementById("f"+i);
  if(!u){f.textContent="Choose an answer first.";f.className="fw-bold text-warning-emphasis";return}
  const ok=u.length===q[3].length&&u.every((x,n)=>q[5]==="x"?x===q[3][n]:q[3].includes(x));
  st[i]={chk:true,ok};
  const c=document.getElementById("c"+i);
  c.classList.remove("ok","bad");c.classList.add(ok?"ok":"bad");
  f.textContent=ok?"Correct":"Not quite. Try again or view the answer.";
  f.className="fw-bold "+(ok?"text-success":"text-danger");
  upd();
}
function view(i){
  const q=Q[i],r=document.getElementById("r"+i);
  let ans;
  if(q[5]==="x"){ans=q[6].map((it,j)=>`${j+1} → ${L[q[3][j]]}. ${q[2][q[3][j]]}`).join("<br>")}
  else{
    q[3].forEach(n=>document.getElementById(`q${i}o${n}`).classList.add("right"));
    if(st[i].chk&&!st[i].ok)document.querySelectorAll(`input[name=q${i}]:checked`).forEach(e=>{if(!q[3].includes(+e.value))e.parentElement.classList.add("wrong")});
    ans=q[3].map(n=>`${L[n]}. ${q[2][n]}`).join("<br>");
  }
  r.innerHTML=`<strong>Correct answer:</strong><br>${ans}<p class="mb-0 mt-2"><strong>Reason:</strong> ${q[4]}</p>`;
  r.classList.remove("d-none");
}
function upd(){
  const a=st.filter(x=>x.chk).length,c=st.filter(x=>x.ok).length;
  document.getElementById("sc").textContent=`Score ${c} / ${Q.length}`;
  document.getElementById("at").textContent=a;
  document.getElementById("pb").style.width=(a/Q.length*100)+"%";
}
function tick(){const s=Math.floor((Date.now()-t0)/1000);document.getElementById("tm").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function finish(){
  const c=st.filter(x=>x.ok).length,a=st.filter(x=>x.chk).length,p=Math.round(c/Q.length*100);
  const by={};Q.forEach((q,i)=>{by[q[0]]=by[q[0]]||{n:0,c:0};by[q[0]].n++;if(st[i].ok)by[q[0]].c++});
  const rows=Object.keys(by).map(k=>{const x=by[k],pc=x.c/x.n;return `<tr><td>${SEC[k]}</td><td>${x.c} / ${x.n}</td><td>${pc>=.8?"Strong":pc>=.6?"Fair":"Review"}</td></tr>`}).join("");
  const el=document.getElementById("result");
  el.className="qcard ok";
  el.innerHTML=`<h2 class="h4">Your result: ${c} / ${Q.length} (${p}%)</h2><p>Checked ${a} of ${Q.length} questions. Unchecked questions count as zero. This is a practice simulation, not an official pass mark. Aim for 80% or higher before you move on.</p><div class="table-responsive"><table class="table table-sm"><thead><tr><th>Topic</th><th>Score</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div><p class="mb-0">Press View answer on any question you missed to read the reason.</p>`;
  window.scrollTo({top:0,behavior:"smooth"});
}
function resetAll(){
  if(!confirm("Reset all answers and the timer?"))return;
  build();upd();t0=Date.now();
  const el=document.getElementById("result");el.className="qcard d-none";el.innerHTML="";
  window.scrollTo({top:0});
}
build();upd();timer=setInterval(tick,1000);
</script>
</body>
</html>
